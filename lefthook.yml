pre-commit:
  jobs:
    - name: bookhoard membership
      glob: "bookhoard/**/*.tung"
      run: make bookhoard-membership
      stage_fixed: true

    - name: fourmolu
      glob: "**/*.hs"
      run: fourmolu --mode inplace {staged_files}
      stage_fixed: true

    - name: deno
      glob: "**/*.{ts,html}"
      run: |
        deno lint {staged_files}
        deno fmt {staged_files}
      stage_fixed: true
