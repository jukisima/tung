pre-commit:
  jobs:
    - name: format haskell
      glob: "**/*.hs"
      run: fourmolu --mode inplace {staged_files}
      stage_fixed: true

    - name: format typescript
      glob: "**/*.{ts,html}"
      run: |
        deno lint {staged_files}
        deno fmt {staged_files}
      stage_fixed: true

    - name: test
      run: make test
